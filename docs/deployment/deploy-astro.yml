name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Check
        run: npm run check
      - name: Build and verify release
        run: npm run build
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          force: false
          clean: true
          # Keep previously published archives and the assets they reference.
          # The four old landing pages above are replaced by explicit redirects.
          clean-exclude: |
            assets/**
            blog/**
            news/**
            people/**
            teaching/**
            reports/**
            feed.xml
